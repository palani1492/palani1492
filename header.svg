<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Palaniappan Meiyappan. Good products are mostly listening. I do the other part too. An animated QMS Pro readiness score rises from 42 to 100 as three findings are fixed.">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .a{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
    .ring{stroke-dashoffset:145.77;stroke:#fbbf24;animation-name:ring}
    .n1,.f1{animation-name:n1}
    .n2{opacity:0;animation-name:n2}
    .n3{opacity:0;animation-name:n3}
    .n4,.d3{opacity:0;animation-name:n4}
    .d1{opacity:0;animation-name:d1}
    .f2{animation-name:f2}
    .d2{opacity:0;animation-name:d2}
    .f3{animation-name:f3}
    .w{fill:#64748b;animation-name:w}
    .w2{animation-delay:2s}.w3{animation-delay:4s}.w4{animation-delay:6s}.w5{animation-delay:8s}.w6{animation-delay:10s}
    @keyframes ring{0%,14%{stroke-dashoffset:145.77;stroke:#fbbf24}18%,31%{stroke-dashoffset:98.02;stroke:#fbbf24}35%,48%{stroke-dashoffset:50.27;stroke:#fbbf24}52%,94%{stroke-dashoffset:0;stroke:#34d399}100%{stroke-dashoffset:145.77;stroke:#fbbf24}}
    @keyframes n1{0%,14%{opacity:1}17%,97%{opacity:0}100%{opacity:1}}
    @keyframes n2{0%,15%{opacity:0}18%,31%{opacity:1}34%,100%{opacity:0}}
    @keyframes n3{0%,32%{opacity:0}35%,48%{opacity:1}51%,100%{opacity:0}}
    @keyframes n4{0%,49%{opacity:0}52%,94%{opacity:1}97%,100%{opacity:0}}
    @keyframes d1{0%,15%{opacity:0}18%,94%{opacity:1}97%,100%{opacity:0}}
    @keyframes f2{0%,31%{opacity:1}34%,97%{opacity:0}100%{opacity:1}}
    @keyframes d2{0%,32%{opacity:0}35%,94%{opacity:1}97%,100%{opacity:0}}
    @keyframes f3{0%,48%{opacity:1}51%,97%{opacity:0}100%{opacity:1}}
    @keyframes w{0%{fill:#64748b}2%,15%{fill:#f8fafc}17%,100%{fill:#64748b}}
    @media (prefers-reduced-motion:reduce){.a{animation:none}}
  </style>

  <rect width="1200" height="380" rx="24" fill="#0b1220"/>
  <rect x=".5" y=".5" width="1199" height="379" rx="23.5" fill="none" stroke="#1e293b"/>

  <!-- left: name and headline -->
  <text x="56" y="84" font-size="15" font-weight="600" letter-spacing="2.5" fill="#34d399">PALANIAPPAN MEIYAPPAN</text>
  <text x="56" y="150" font-size="46" font-weight="700" fill="#f8fafc">Good products are</text>
  <text x="56" y="206" font-size="46" font-weight="700" fill="#f8fafc">mostly listening.</text>
  <text x="56" y="252" font-size="24" fill="#94a3b8">I do the other part too.</text>
  <text x="56" y="322" font-size="17" font-weight="600">
    <tspan class="a w">listen</tspan><tspan fill="#334155" dx="10">/</tspan>
    <tspan class="a w w2" dx="10">decide</tspan><tspan fill="#334155" dx="10">/</tspan>
    <tspan class="a w w3" dx="10">design</tspan><tspan fill="#334155" dx="10">/</tspan>
    <tspan class="a w w4" dx="10">build</tspan><tspan fill="#334155" dx="10">/</tspan>
    <tspan class="a w w5" dx="10">ship</tspan><tspan fill="#334155" dx="10">/</tspan>
    <tspan class="a w w6" dx="10">repeat</tspan>
  </text>

  <!-- right: QMS Pro readiness card -->
  <g transform="translate(660 40)">
    <rect width="484" height="300" rx="18" fill="#111a2e" stroke="#1e293b"/>
    <text x="28" y="40" font-size="12" font-weight="600" letter-spacing="2" fill="#64748b">QMS PRO  /  READINESS</text>

    <circle cx="76" cy="110" r="40" fill="none" stroke="#1e293b" stroke-width="8"/>
    <circle class="a ring" cx="76" cy="110" r="40" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="251.33" transform="rotate(-90 76 110)"/>
    <g font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">
      <text class="a n1" x="76" y="119">42</text>
      <text class="a n2" x="76" y="119">61</text>
      <text class="a n3" x="76" y="119">80</text>
      <text class="a n4" x="76" y="119">100</text>
    </g>

    <g class="a f3">
      <text x="140" y="106" font-size="22" font-weight="700" fill="#fbbf24">Not ready</text>
      <text x="140" y="130" font-size="14" fill="#94a3b8">Things an assessor would flag</text>
    </g>
    <g class="a d3">
      <text x="140" y="106" font-size="22" font-weight="700" fill="#34d399">Ready for assessment</text>
      <text x="140" y="130" font-size="14" fill="#94a3b8">Nothing left to flag</text>
    </g>

    <!-- finding rows -->
    <g font-size="13">
      <g transform="translate(28 164)">
        <rect width="428" height="34" rx="9" fill="#0b1220"/>
        <text x="14" y="22" fill="#64748b" font-weight="600">6.4</text>
        <text x="62" y="22" fill="#cbd5e1">8 equipment items have no evidence</text>
        <g class="a f1"><rect x="318" y="6" width="100" height="22" rx="11" fill="none" stroke="#fbbf24"/><text x="368" y="21" font-size="11" fill="#fbbf24" text-anchor="middle">Will be flagged</text></g>
        <g class="a d1"><rect x="318" y="6" width="100" height="22" rx="11" fill="#34d399"/><path d="M344 17l4 4 7-8" fill="none" stroke="#052e1b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="376" y="21" font-size="11" font-weight="700" fill="#052e1b" text-anchor="middle">Fixed</text></g>
      </g>
      <g transform="translate(28 206)">
        <rect width="428" height="34" rx="9" fill="#0b1220"/>
        <text x="14" y="22" fill="#64748b" font-weight="600">6.4.13</text>
        <text x="62" y="22" fill="#cbd5e1">2 instruments are past calibration</text>
        <g class="a f2"><rect x="318" y="6" width="100" height="22" rx="11" fill="none" stroke="#fbbf24"/><text x="368" y="21" font-size="11" fill="#fbbf24" text-anchor="middle">Will be flagged</text></g>
        <g class="a d2"><rect x="318" y="6" width="100" height="22" rx="11" fill="#34d399"/><path d="M344 17l4 4 7-8" fill="none" stroke="#052e1b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="376" y="21" font-size="11" font-weight="700" fill="#052e1b" text-anchor="middle">Fixed</text></g>
      </g>
      <g transform="translate(28 248)">
        <rect width="428" height="34" rx="9" fill="#0b1220"/>
        <text x="14" y="22" fill="#64748b" font-weight="600">6.5</text>
        <text x="62" y="22" fill="#cbd5e1">7 traceability items lack evidence</text>
        <g class="a f3"><rect x="318" y="6" width="100" height="22" rx="11" fill="none" stroke="#fbbf24"/><text x="368" y="21" font-size="11" fill="#fbbf24" text-anchor="middle">Will be flagged</text></g>
        <g class="a d3"><rect x="318" y="6" width="100" height="22" rx="11" fill="#34d399"/><path d="M344 17l4 4 7-8" fill="none" stroke="#052e1b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="376" y="21" font-size="11" font-weight="700" fill="#052e1b" text-anchor="middle">Fixed</text></g>
      </g>
    </g>
  </g>
</svg>
